# ============================================================
# Project Configuration — L40s (48 GB VRAM) Server
# Model: Qwen2.5-VL-72B-Instruct (4-bit NF4 ≈ 38-42 GB)
#
# VRAM Note:
#   72B NF4 double-quant ≈ 38-42 GB
#   7B  NF4 double-quant ≈  3-4  GB
#   Both cannot coexist safely in 48 GB.
#   Use sequential loading (swap) strategy in pipeline.py.
# ============================================================

paths:
  # Local paths (relative to project root, or set as absolute)
  vlm_model_dir:         "models/vlm"
  finetuned_model_dir:   "models/finetuned_7b"   # merged LoRA 7B (run scripts/merge_lora.py once)
  embedding_model_dir:   "models/embeddings"
  faiss_index:           "models/faiss/index.faiss"
  faiss_metadata:        "models/faiss/metadata.pkl"
  knowledge_base:        "src/retrieval/knowledge_base/"
  synthetic_data_csv:    "data/synthetic_data/train.csv"
  synthetic_data_images: "data/synthetic_data/images/"

thresholds:
  # VLM confidence >= this → trust and return directly
  vlm_confidence:       0.75
  # Fine-tuned 7B confidence >= this → trust its answer
  finetuned_confidence: 0.80
  # VLM confidence < this → output 5 (skip) to avoid -0.25 penalty
  skip_threshold:       0.55
  math_confidence:      0.90
  retrieval_similarity: 0.80

vlm:
  model_id: "Qwen/Qwen2.5-VL-72B-Instruct"
  quantization: "4bit"           # NF4 double-quant for 72B on 48 GB
  max_new_tokens: 128
  temperature: 0.0               # Greedy — fully deterministic
  attn_implementation: "sdpa"

finetuned_7b:
  base_model_id: "Qwen/Qwen2.5-VL-7B-Instruct"
  quantization:  "4bit"          # NF4 4-bit to minimise VRAM during swap
  max_new_tokens: 256
  enabled: false                 # No trained weights available; 72B alone achieves 95.4%

embedder:
  model_name: "all-MiniLM-L6-v2"
  batch_size: 64
